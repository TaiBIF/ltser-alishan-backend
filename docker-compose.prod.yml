services:
    web:
        command: >
            sh -c "python manage.py migrate &&
                   gunicorn core.wsgi:application --bind 0.0.0.0:8000"
        expose:
            - "8000"

    nginx:
        image: nginx:alpine
        depends_on:
            - web
            - n8n
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/django.conf:/etc/nginx/conf.d/default.conf:ro
            - static_volume:/app/static
            - media_volume:/app/media
            - certbot_www:/var/www/certbot
            - letsencrypt:/etc/letsencrypt
        restart: unless-stopped

    n8n:
        environment:
            N8N_HOST: ltsertw-alisan.org
            N8N_PROTOCOL: https
            N8N_PORT: 5678
            N8N_PROXY_HOPS: 1
            WEBHOOK_URL: https://ltsertw-alisan.org/n8n/
            N8N_WEBHOOK_URL: https://ltsertw-alisan.org/n8n/
            N8N_EDITOR_BASE_URL: https://ltsertw-alisan.org/n8n/
            N8N_SECURE_COOKIE: "true"

    certbot:
        image: certbot/certbot
        volumes:
            - certbot_www:/var/www/certbot
            - letsencrypt:/etc/letsencrypt
        entrypoint: /bin/sh

volumes:
    certbot_www:
    letsencrypt:
