services:
    web:
        build: .
        volumes:
            - ./app:/app

            - static_volume:/app/static
            - media_volume:/app/media
        env_file:
            - .env
        command: >
            sh -c "python manage.py migrate &&
                   python manage.py runserver 0.0.0.0:8000"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

        expose:
            - "8000"
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        env_file:
            - .env
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    celery:
        build: .
        volumes:
            - ./app:/app
            - static_volume:/app/static
            - media_volume:/app/media
        env_file:
            - .env
        command: celery -A core worker --beat --loglevel=info
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    n8n:
        image: n8nio/n8n:2.41.4
        expose:
            - "5678"
        environment:
            TZ: Asia/Taipei
            N8N_BASIC_AUTH_ACTIVE: "true"
            N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
            N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
            N8N_HOST: localhost
            N8N_PROTOCOL: http
            N8N_PORT: 5678
            WEBHOOK_URL: http://localhost:5679/
        volumes:
            - ../ltser-alishan-volumes/n8n_data:/home/node/.n8n
        restart: unless-stopped

volumes:
    pg_data:
    static_volume:
    media_volume:
