map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ltsertw-alisan.org;
    client_max_body_size 20M;

    # certbot 驗證用路徑
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /n8n {
        return 301 https://$host/n8n/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ltsertw-alisan.org;

    # 檔案上傳上限 20 MB
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/ltsertw-alisan.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ltsertw-alisan.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /n8n {
        return 301 /n8n/;
    }

    location ^~ /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix /n8n;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Proxy Django
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Files
    location /static/ {
        alias /app/static/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Media Files
    location /media/ {
        alias /app/media/;
    }
}
